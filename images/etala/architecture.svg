<text x="32" y="122" font-size="12" fill="#334155">JavaScript (assets/js)</text>
<text x="32" y="140" font-size="12" fill="#334155">AJAX requests, JSON replies</text>
<text x="32" y="158" font-size="12" fill="#334155">Leaflet map on report pages</text>
<text x="32" y="176" font-size="12" fill="#334155">Weather widget</text>
