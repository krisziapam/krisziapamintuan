<text x="348" y="134" font-size="12" fill="#334155">Equipment, vehicles and fuel, emergency directory, profile</text>
<rect x="336" y="176" width="448" height="70" rx="5" fill="#fff" stroke="#0F172A" stroke-width="1.2"/>
<text x="348" y="198" font-size="13.5" font-weight="700" fill="#0F172A">admin/ (administrator pages)</text>
<text x="348" y="220" font-size="12" fill="#334155">Dashboard, reports, analytics, audit log, users, CSV and XML export</text>
<rect x="336" y="262" width="448" height="70" rx="5" fill="#fff" stroke="#0F172A" stroke-width="1.2"/>
<text x="348" y="284" font-size="13.5" font-weight="700" fill="#0F172A">api-*.php (JSON endpoints)</text>
<text x="348" y="306" font-size="12" fill="#334155">api-calendar, api-notifications, api-operations</text>
<rect x="336" y="348" width="448" height="166" rx="5" fill="#fff" stroke="#0F172A" stroke-width="1.2"/>
<text x="348" y="370" font-size="13.5" font-weight="700" fill="#0F172A">includes/ (shared code)</text>
<text x="348" y="392" font-size="12" fill="#334155">auth.php: sessions, login, role checks, CSRF tokens</text>
<text x="348" y="410" font-size="12" fill="#334155">db.php: one PDO connection (reads config.php)</text>
<text x="348" y="428" font-size="12" fill="#334155">queries.php, v2.php: queries with prepared statements</text>
<text x="348" y="446" font-size="12" fill="#334155">upload.php: photo type and size checks</text>
<text x="348" y="464" font-size="12" fill="#334155">header.php, footer.php: shared page layout</text>
<rect x="880" y="60" width="200" height="120" rx="5" fill="#fff" stroke="#0F172A" stroke-width="1.2"/>
<text x="892" y="82" font-size="13.5" font-weight="700" fill="#0F172A">MySQL / MariaDB</text>
<text x="892" y="104" font-size="12" fill="#334155">Database: etala_v2</text>
<text x="892" y="122" font-size="12" fill="#334155">24 tables shown in the ERD</text>
<text x="892" y="140" font-size="12" fill="#334155">Managed in phpMyAdmin</text>
<rect x="880" y="260" width="200" height="150" rx="5" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.2"/>
<text x="892" y="282" font-size="13.5" font-weight="700" fill="#0F172A">uploads/ folder</text>
<text x="892" y="304" font-size="12" fill="#334155">Incident photos and</text>
<text x="892" y="322" font-size="12" fill="#334155">fuel receipts.</text>
<text x="892" y="340" font-size="12" fill="#334155">Not reachable by URL;</text>
<text x="892" y="358" font-size="12" fill="#334155">photo.php and</text>
<text x="892" y="376" font-size="12" fill="#334155">fuel-receipt.php check</text>
<text x="892" y="394" font-size="12" fill="#334155">the login first.</text>
